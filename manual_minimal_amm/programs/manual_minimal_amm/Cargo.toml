[package]
name = "manual_minimal_amm"
version = "0.1.0"
description = "SPL token AMM with swap fees"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "manual_minimal_amm"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.1.2", features = ["associated_token", "token"] }

[dev-dependencies]
litesvm = "0.10.0"
litesvm-token = "0.10.0"
solana-instruction-error = "2.5.0"
solana-transaction = "3.0.2"
solana-transaction-error = "3.4.0"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
